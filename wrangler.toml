name = "checkin"
main = "src/index.js"
compatibility_date = "2026-09-30"
# 面板上手工设的变量（PASSWORD 之外若还有）在 wrangler deploy 时不被抹掉
keep_vars = true
# 自定义域名不在此配置：在 Cloudflare 面板「 Workers 和 Pages → 你的 Worker → 设置 → 域名和路由 」
# 里单独绑定即可。wrangler.toml 不写 routes 不会清掉已绑定的域名。
workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "CHECKIN_KV"
# 换成你自己在面板上创建的 KV 命名空间 id（存储和数据库 → KV）
id = "cd89af6cf1ca4d17a778820b3dbd062c"

[triggers]
# 一条就够：每轮醒来自己算「谁到期」，加第 N 个工具不再消耗 cron 槽。
# 免费版上限是每账号 5 条 cron，不是每 Worker。
crons = ["*/30 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
